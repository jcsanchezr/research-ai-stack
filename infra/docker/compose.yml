services:
  dsh:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DSH_VERSION: 0.1.5-rc.1

    container_name: agentlab-dsh
    restart: unless-stopped

    user: "1000:1000"
    environment:
      BLABLADOR_DUMMY_KEY: "THIS_IS_NOT_THE_REAL_TOKEN"

    volumes:
      - type: bind
        source: ../../workspaces/public
        target: /workspace

      - type: volume
        source: dsh-home
        target: /home/node/.dsh

      - type: bind
        source: ../../ecc
        target: /ecc
        read_only: true

    read_only: true

    tmpfs:
      - /tmp:size=512m,mode=1777
      - /home/node/.npm:size=256m,uid=1000,gid=1000

    cap_drop:
      - ALL

    security_opt:
      - no-new-privileges:true

    pids_limit: 256
    mem_limit: 2g
    cpus: 1.5

    networks:
      - agent-internal

  blablador-gateway:
    build:
      context: ../provider-gateway
      dockerfile: Dockerfile

    container_name: agentlab-blablador-gateway
    restart: unless-stopped

    read_only: true

    tmpfs:
      - /tmp:size=64m,mode=1777
      - /run:size=8m,uid=101,gid=101,mode=755
      - /var/cache/nginx:size=32m,uid=101,gid=101,mode=755

    cap_drop:
      - ALL

    security_opt:
      - no-new-privileges:true

    pids_limit: 64
    mem_limit: 128m
    cpus: 0.25

    networks:
      - agent-internal
      - provider-egress

    secrets:
      - source: blablador_token
        target: blablador_token
networks:
  agent-internal:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.30.251.0/24
          gateway: 172.30.251.1

  provider-egress:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.252.0/24
          gateway: 172.30.252.1
volumes:
  dsh-home:
secrets:
  blablador_token:
    file: ../provider-gateway/secrets/blablador-token
