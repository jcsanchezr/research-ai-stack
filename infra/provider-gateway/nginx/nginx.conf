pid /tmp/nginx.pid;

events {}

http {
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;

    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    server {
        listen 8080;

        location /v1/ {
            proxy_pass https://api.blablador.fz-juelich.de/v1/;

            proxy_ssl_server_name on;
            proxy_ssl_name api.blablador.fz-juelich.de;

            proxy_set_header Host api.blablador.fz-juelich.de;

            # IMPORTANT:
            # Ignore any Authorization supplied by DSH.
            proxy_set_header Authorization "Bearer __BLABLADOR_TOKEN__";

            proxy_http_version 1.1;
            proxy_buffering off;
        }
    }
}
